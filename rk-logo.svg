<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bwGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e5e5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer circle - black -->
  <circle cx="50" cy="50" r="48" fill="#000000"/>
  
  <!-- Inner background - white -->
  <circle cx="50" cy="50" r="44" fill="url(#bwGradient)"/>
  
  <!-- Subtle border -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#000000" stroke-width="0.8" opacity="0.3"/>
  
  <!-- RK text with rich black -->
  <text x="50" y="50" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="46" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle" letter-spacing="1" filter="url(#shadow)">RK</text>
</svg>